<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>YGLC - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0A0506;
            --bg-card: #0A120E;
            --bg-card-hover: #101815;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --text-main: #E5E7EB;
            --text-muted: #9CA3AF;
            --border-color: rgba(212, 175, 55, 0.2);
        }
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            padding: 30px; 
            border-radius: 12px; 
            width: 360px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: bold;
            line-height: 1;
            padding: 0;
            width: auto;
            margin: 0;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: var(--gold);
            background: none;
        }
        h2 { 
            font-family: 'Cinzel', serif;
            color: var(--gold); 
            font-size: 22px; 
            margin-bottom: 25px; 
            text-align: center; 
            font-weight: 700;
            letter-spacing: 1px;
        }
        label { 
            font-size: 14px; 
            color: var(--text-muted); 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            background: var(--bg-deep); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            border-radius: 8px; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            box-sizing: border-box; 
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--gold);
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--gold); 
            color: var(--bg-deep); 
            border: none; 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin-bottom: 12px; 
            font-size: 16px;
            transition: all 0.3s;
        }
        button:hover { 
            background: var(--gold-light); 
        }
        button:disabled {
            background: #374151;
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .register-link-btn { 
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            border: 1px solid var(--border-color); 
            color: var(--gold); 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            text-align: center; 
            display: block; 
            box-sizing: border-box; 
            text-decoration: none; 
            font-size: 15px;
            transition: all 0.3s;
        }
        .register-link-btn:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }
        .error { 
            color: #f87171; 
            font-size: 13px; 
            text-align: center; 
            margin-bottom: 15px; 
            display: none; 
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <button class="close-btn" onclick="goBack()" title="ပိတ်ရန်">&times;</button>
        <h2>YGLC MEMBER LOGIN</h2>
        <form onsubmit="handleLogin(event)">
            <label>ဖုန်းနံပါတ်ဖြင့် ဝင်ရန်</label>
            <input type="text" id="loginPhone" required placeholder="09xxxxxxxxx">
            <div id="errorMsg" class="error">ဤဖုန်းနံပါတ်ဖြင့် ငွေပေးချေအတည်ပြုချက် မရှိသေးပါ။</div>
            <button type="submit" id="loginBtn">လော့ဂ်အင်ဝင်မည်</button>
        </form>
        <a href="register.html" class="register-link-btn">သင်တန်းအသစ် အပ်နှံရန် (Register)</a>
    </div>

    <script>
        const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxuwcRgubS8XQLXC3yIu4D0j5IzWm1Mr6vyXX8pKJDgr9yPAS1JONQa6703BMk7giVIYw/exec';

        function normalizePhone(phone) {
            if (!phone) return "";
            let cleaned = phone.toString().replace(/\s+/g, '').replace(/[-+]/g, '');
            if (cleaned.startsWith('959')) {
                cleaned = '0' + cleaned.substring(2);
            }
            return cleaned;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("isLoggedIn") === "true") {
                window.location.href = "dashboard.html";
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const rawPhone = document.getElementById('loginPhone').value.trim();
            const inputPhone = normalizePhone(rawPhone);
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerText = 'စစ်ဆေးနေပါသည်...';

            try {
                const response = await fetch(GOOGLE_SHEET_API_URL);
                const data = await response.json();

                let foundCourses = null;

                if (data && data.status === "success" && data.students) {
                    const matchedStudent = data.students.find(item => normalizePhone(item.phone) === inputPhone);
                    
                    if (matchedStudent) {
                        let rawCourses = matchedStudent.courses;
                        let courseNumbers = [];
                        
                        const myanmarNumbers = {'၀': '0', '၁': '1', '၂': '2', '၃': '3', '၄': '4', '၅': '5', '၆': '6', '၇': '7', '၈': '8', '၉': '9'};
                        let courseNameStr = String(rawCourses);
                        let convertedStr = courseNameStr.replace(/[၀-၉]/g, match => myanmarNumbers[match]);
                        let matches = convertedStr.match(/\d+/g);
                        
                        if (matches) {
                            matches.forEach(m => {
                                let num = parseInt(m, 10);
                                if (num >= 1 && num <= 8 && !courseNumbers.includes(num)) {
                                    courseNumbers.push(num);
                                }
                            });
                        }
                        foundCourses = courseNumbers.length > 0 ? courseNumbers : [1];
                    }
                }

                if (inputPhone === "09971097886") {
                    foundCourses = [1, 2, 3, 4, 5, 6, 7, 8];
                }

                if (foundCourses) {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("userPhone", inputPhone);
                    localStorage.setItem("userPurchasedCourses", JSON.stringify(foundCourses));
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'လော့ဂ်အင်ဝင်မည်';
                }

            } catch (err) {
                console.error('Login check error:', err);
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerText = 'လော့ဂ်အင်ဝင်မည်';
            }
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
