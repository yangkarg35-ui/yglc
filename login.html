<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>YGLC - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN ထည့်သွင်းခြင်း -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background: #f8f9fa; 
            color: #2d3748; 
            font-family: 'Padauk', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            padding: 30px; 
            border-radius: 12px; 
            width: 320px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 20px;
            color: #a0aec0;
            cursor: pointer;
            font-weight: bold;
            line-height: 1;
            padding: 0;
            width: auto;
            margin: 0;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #e53e3e;
            background: none;
        }
        h2 { 
            color: #8B5A2B; 
            font-size: 20px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: 700;
        }
        label { 
            font-size: 14px; 
            color: #718096; 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: #f7fafc; 
            border: 1px solid #e2e8f0; 
            color: #2d3748; 
            border-radius: 8px; 
            font-family: 'Padauk', sans-serif; 
            box-sizing: border-box; 
            font-size: 16px;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #8B5A2B; 
            color: #ffffff; 
            border: none; 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Padauk', sans-serif; 
            margin-bottom: 12px; 
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover { 
            background: #6b4420; 
        }
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .register-link-btn { 
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            border: 1px solid #8B5A2B; 
            color: #8B5A2B; 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Padauk', sans-serif; 
            text-align: center; 
            display: block; 
            box-sizing: border-box; 
            text-decoration: none; 
            font-size: 15px;
        }
        .error { 
            color: #e53e3e; 
            font-size: 13px; 
            text-align: center; 
            margin-top: 10px; 
            display: none; 
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="box">
        <button class="close-btn" onclick="goBack()" title="ပိတ်ရန်">&times;</button>
        <h2>YGLC MEMBER LOGIN</h2>
        <form onsubmit="handleLogin(event)">
            <label>ဖုန်းနံပါတ်ဖြင့် ဝင်ရန်</label>
            <input type="text" id="loginPhone" required placeholder="09xxxxxxxxx">
            <button type="submit" id="loginBtn">လော့ဂ်အင်ဝင်မည်</button>
            <div id="errorMsg" class="error">ဤဖုန်းနံပါတ်ဖြင့် ငွေပေးချေအတည်ပြုချက် မရှိသေးပါ။</div>
        </form>
        <a href="register.html" class="register-link-btn">သင်တန်းအသစ် အပ်နှံရန် (Register)</a>
    </div>

    <script>
        // Supabase ချိတ်ဆက်ရန် အချက်အလက်များ
        const SUPABASE_URL = 'https://qyoyxagrkpzppacnpdbc.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5b3l4YWdya3B6cHBhY25wZGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTg0MTIsImV4cCI6MjEwNDY5NDQxMn0.giB8iSYSZCUQijzUGW6pp1Uo-CB2DUIEt1faZnip9l0';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ဖုန်းနံပါတ် စံသတ်မှတ်ချက် ညှိပေးသည့် Function
        function normalizePhone(phone) {
            if (!phone) return "";
            let cleaned = phone.toString().replace(/\s+/g, '').replace(/[-+]/g, '');
            if (cleaned.startsWith('959')) {
                cleaned = '0' + cleaned.substring(2);
            }
            return cleaned;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("isLoggedIn") === "true") {
                window.location.href = "dashboard.html";
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const rawPhone = document.getElementById('loginPhone').value.trim();
            const inputPhone = normalizePhone(rawPhone);
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerText = 'စစ်ဆေးနေပါသည်...';

            try {
                // ၁. ပထမဆုံး LocalStorage ထဲတွင် ရှိမရှိ စစ်ဆေးခြင်း (Backup အနေဖြင့်)
                let approvedUsers = JSON.parse(localStorage.getItem('approvedUsers')) || {};
                let foundCourses = approvedUsers[inputPhone] || approvedUsers[rawPhone];

                // ၂. LocalStorage ထဲမတွေ့ပါက Supabase Database ထဲသို့ တိုက်ရိုက် လှမ်းစစ်ဆေးခြင်း
                if (!foundCourses) {
                    const { data, error } = await supabase
                        .from('registrations')
                        .select('*')
                        .eq('status', 'approved');

                    if (!error && data) {
                        // ထည့်သွင်းထားသော ဖုန်းနံပါတ်နှင့် ကိုက်ညီသော approved record ကို ရှာမည်
                        const matchedRecord = data.find(item => normalizePhone(item.phone) === inputPhone);
                        if (matchedRecord) {
                            let rawCourses = matchedRecord.courses;
                            if (typeof rawCourses === 'string') {
                                try { rawCourses = JSON.parse(rawCourses); } catch(err) { rawCourses = [matchedRecord.courses]; }
                            }

                            // သင်တန်းနံပါတ်များကို ကောက်ထုတ်ခြင်း
                            let courseNumbers = [];
                            const myanmarNumbers = {'၀': '0', '၁': '1', '၂': '2', '၃': '3', '၄': '4', '၅': '5', '၆': '6', '၇': '7', '၈': '8', '၉': '9'};
                            
                            if (Array.isArray(rawCourses)) {
                                rawCourses.forEach(c => {
                                    let courseNameStr = String(c);
                                    let convertedStr = courseNameStr.replace(/[၀-၉]/g, match => myanmarNumbers[match]);
                                    let matches = convertedStr.match(/\d+/g);
                                    if (matches) {
                                        matches.forEach(m => {
                                            let num = parseInt(m, 10);
                                            if (num >= 1 && num <= 8 && !courseNumbers.includes(num)) {
                                                courseNumbers.push(num);
                                            }
                                        });
                                    }
                                });
                            }
                            foundCourses = courseNumbers.length > 0 ? courseNumbers : [1];
                        }
                    }
                }

                // အောင်မြင်စွာ တွေ့ရှိပါက Dashboard သို့ ပို့ပေးမည်
                if (foundCourses) {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("userPhone", inputPhone);
                    localStorage.setItem("userPurchasedCourses", JSON.stringify(foundCourses));
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'လော့ဂ်အင်ဝင်မည်';
                }

            } catch (err) {
                console.error('Login check error:', err);
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerText = 'လော့ဂ်အင်ဝင်မည်';
            }
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
