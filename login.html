<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>YGLC - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #f8f9fa; 
            color: #2d3748; 
            font-family: 'Padauk', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            padding: 30px; 
            border-radius: 12px; 
            width: 320px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 20px;
            color: #a0aec0;
            cursor: pointer;
            font-weight: bold;
            line-height: 1;
            padding: 0;
            width: auto;
            margin: 0;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #e53e3e;
            background: none;
        }
        h2 { 
            color: #8B5A2B; 
            font-size: 20px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: 700;
        }
        label { 
            font-size: 14px; 
            color: #718096; 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: #f7fafc; 
            border: 1px solid #e2e8f0; 
            color: #2d3748; 
            border-radius: 8px; 
            font-family: 'Padauk', sans-serif; 
            box-sizing: border-box; 
            font-size: 16px;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #8B5A2B; 
            color: #ffffff; 
            border: none; 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Padauk', sans-serif; 
            margin-bottom: 12px; 
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover { 
            background: #6b4420; 
        }
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .register-link-btn { 
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            border: 1px solid #8B5A2B; 
            color: #8B5A2B; 
            font-weight: 700; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Padauk', sans-serif; 
            text-align: center; 
            display: block; 
            box-sizing: border-box; 
            text-decoration: none; 
            font-size: 15px;
        }
        .error { 
            color: #e53e3e; 
            font-size: 13px; 
            text-align: center; 
            margin-top: 10px; 
            display: none; 
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="box">
        <button class="close-btn" onclick="goBack()" title="ပိတ်ရန်">&times;</button>
        <h2>YGLC MEMBER LOGIN</h2>
        <form onsubmit="handleLogin(event)">
            <label>ဖုန်းနံပါတ်ဖြင့် ဝင်ရန်</label>
            <input type="text" id="loginPhone" required placeholder="09xxxxxxxxx">
            <button type="submit" id="loginBtn">လော့ဂ်အင်ဝင်မည်</button>
            <div id="errorMsg" class="error">ဤဖုန်းနံပါတ်ဖြင့် ငွေပေးချေအတည်ပြုချက် မရှိသေးပါ။</div>
        </form>
        <a href="register.html" class="register-link-btn">သင်တန်းအသစ် အပ်နှံရန် (Register)</a>
    </div>

    <script>
        // Google Apps Script Web App URL
        const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxuwcRgubS8XQLXC3yIu4D0j5IzWm1Mr6vyXX8pKJDgr9yPAS1JONQa6703BMk7giVIYw/exec';

        // ဖုန်းနံပါတ် စံသတ်မှတ်ချက် ညှိပေးသည့် Function
        function normalizePhone(phone) {
            if (!phone) return "";
            let cleaned = phone.toString().replace(/\s+/g, '').replace(/[-+]/g, '');
            if (cleaned.startsWith('959')) {
                cleaned = '0' + cleaned.substring(2);
            }
            return cleaned;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("isLoggedIn") === "true") {
                window.location.href = "dashboard.html";
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const rawPhone = document.getElementById('loginPhone').value.trim();
            const inputPhone = normalizePhone(rawPhone);
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerText = 'စစ်ဆေးနေပါသည်...';

            try {
                // Google Sheet မှ ကျောင်းသားစာရင်းများကို ဆွဲထုတ်ခြင်း
                const response = await fetch(GOOGLE_SHEET_API_URL);
                const data = await response.json();

                let foundCourses = null;

                if (data && data.status === "success" && data.students) {
                    // ထည့်သွင်းထားသော ဖုန်းနံပါတ်နှင့် ကိုက်ညီသော ကျောင်းသားကို ရှာမည်
                    const matchedStudent = data.students.find(item => normalizePhone(item.phone) === inputPhone);
                    
                    if (matchedStudent) {
                        let rawCourses = matchedStudent.courses; // ဥပမာ: "သင်တန်း ၁, သင်တန်း ၂"
                        let courseNumbers = [];
                        
                        // မြန်မာသင်တန်း စာသားများမှ နံပါတ်များကို ထုတ်ယူခြင်း
                        const myanmarNumbers = {'၀': '0', '၁': '1', '၂': '2', '၃': '3', '၄': '4', '၅': '5', '၆': '6', '၇': '7', '၈': '8', '၉': '9'};
                        let courseNameStr = String(rawCourses);
                        let convertedStr = courseNameStr.replace(/[၀-၉]/g, match => myanmarNumbers[match]);
                        let matches = convertedStr.match(/\d+/g);
                        
                        if (matches) {
                            matches.forEach(m => {
                                let num = parseInt(m, 10);
                                if (num >= 1 && num <= 8 && !courseNumbers.includes(num)) {
                                    courseNumbers.push(num);
                                }
                            });
                        }
                        foundCourses = courseNumbers.length > 0 ? courseNumbers : [1];
                    }
                }

                // အကယ်၍ Admin ဖုန်းနံပါတ်ဖြစ်ပါက သင်တန်းအားလုံး (၁ မှ ၈ ထိ) ဖွင့်ပေးမည်
                if (inputPhone === "09971097886") {
                    foundCourses = [1, 2, 3, 4, 5, 6, 7, 8];
                }

                // အောင်မြင်စွာ တွေ့ရှိပါက Dashboard သို့ ပို့ပေးမည်
                if (foundCourses) {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("userPhone", inputPhone);
                    localStorage.setItem("userPurchasedCourses", JSON.stringify(foundCourses));
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'လော့ဂ်အင်ဝင်မည်';
                }

            } catch (err) {
                console.error('Login check error:', err);
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerText = 'လော့ဂ်အင်ဝင်မည်';
            }
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
