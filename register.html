<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGLC - Course Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<!-- Supabase CDN Integration -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg-deep: #0A0506;
    --bg-card: rgba(10, 18, 14, 0.85);
    --bg-card-hover: #101815;
    --gold: #D4AF37;
    --gold-light: #F3E5AB;
    --text-main: #E5E7EB;
    --text-muted: #9CA3AF;
    --border-color: rgba(212, 175, 55, 0.2);
}

/* Fixed Background matching index theme with 01.jpg */
body { 
    background-image: url('01.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text-main); 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    padding: 20px 0; 
    overflow-x: hidden; 
}

/* Dark overlay to match main site readability */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 5, 6, 0.85);
    z-index: -1;
}

.box { 
    background: var(--bg-card); 
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-color); 
    padding: 30px; 
    border-radius: 12px; 
    width: 480px; 
    box-sizing: border-box; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.7); 
    position: relative; 
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-muted);
    cursor: pointer;
    font-weight: bold;
    line-height: 1;
    padding: 0;
    width: auto;
    margin: 0;
    transition: color 0.2s;
}
.close-btn:hover {
    color: var(--gold);
    background: none;
}
h2 { 
    font-family: 'Cinzel', serif;
    color: var(--gold); 
    font-size: 20px; 
    margin-bottom: 25px; 
    text-align: center; 
    font-weight: 700;
    letter-spacing: 1px;
}
label { 
    font-size: 13px; 
    color: var(--text-muted); 
    display: block; 
    margin-bottom: 6px; 
    font-weight: 600; 
}
input[type="text"], input[type="tel"], input[type="file"] { 
    width: 100%; 
    padding: 11px; 
    margin-bottom: 15px; 
    background: var(--bg-deep); 
    border: 1px solid var(--border-color); 
    color: var(--text-main); 
    border-radius: 8px; 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    box-sizing: border-box; 
    font-size: 15px; 
    outline: none; 
    transition: border-color 0.3s;
}
input[type="text"]:focus, input[type="tel"]:focus, input[type="file"]:focus { 
    border-color: var(--gold); 
}
input[type="file"] {
    padding: 8px;
    color: var(--text-muted);
}
.total-box {
    background: rgba(212, 175, 55, 0.05);
    border: 1px solid var(--border-color);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 15px;
    color: var(--gold);
    font-weight: 700;
}

.kpay-box {
    background: var(--bg-deep);
    border: 1px dashed var(--border-color);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
}
.kpay-box b {
    color: var(--gold);
}

.promo-section {
    background: var(--bg-deep);
    border: 2px dashed rgba(212, 175, 55, 0.3);
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    opacity: 0.5;
    pointer-events: none;
}
.promo-option {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    cursor: pointer;
}
.promo-option:last-child {
    margin-bottom: 0;
}
.promo-option input {
    margin-right: 8px;
    cursor: pointer;
}

.promo-notice {
    background: rgba(212, 175, 55, 0.1);
    border-left: 4px solid var(--gold);
    padding: 12px;
    font-size: 13px;
    color: var(--gold-light);
    border-radius: 4px;
    margin-bottom: 15px;
    display: none;
    line-height: 1.6;
    font-weight: 600;
}

.courses-container {
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    background: var(--bg-deep);
}
.course-item {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--text-main);
    cursor: pointer;
}
.course-item.locked {
    color: #4b5563;
    cursor: not-allowed;
}
.course-item input {
    margin-right: 8px;
    cursor: pointer;
}
.course-item.locked input {
    cursor: not-allowed;
}
.soon-tag {
    font-size: 10px;
    color: var(--gold);
    background: rgba(212, 175, 55, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    border: 1px solid var(--border-color);
    font-weight: bold;
}

button[type="submit"] {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: var(--bg-deep);
    border: none;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    text-align: center;
    display: block;
    box-sizing: border-box;
    margin-bottom: 12px;
    transition: all 0.3s;
}
button[type="submit"]:hover { background: var(--gold-light); }
button[type="submit"]:disabled { background: #374151; color: var(--text-muted); cursor: not-allowed; }

.login-guide { text-align: center; margin-top: 15px; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; line-height: 1.5; }
.back-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border-color); color: var(--gold); font-weight: 700; border-radius: 8px; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; display: block; box-sizing: border-box; text-decoration: none; transition: all 0.3s; }
.back-btn:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
.success-msg { color: #34d399; font-size: 14px; font-weight: 600; text-align: center; margin-top: 15px; display: none; line-height: 1.6; background: rgba(52, 211, 153, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(52, 211, 153, 0.3); }
</style>
</head>
<body>

<div class="box">
<button class="close-btn" onclick="goBack()" title="Close / Go Back">&times;</button>
<h2>YGLC - Course Registration</h2>
<form id="regForm" onsubmit="submitRegistration(event)">
<label>Full Name</label>
<input type="text" id="studentName" required placeholder="Student Name">
<label>Phone Number (For Member Login)</label>
<input type="tel" id="studentPhone" required placeholder="09xxxxxxxxx">
<div class="total-box">
Total Amount: <span id="totalPrice">50,000</span> MMK
</div>

<div class="kpay-box">
<b>Transfer via KBZPay:</b><br>
📞 Phone Number - <b>09-971097886</b><br>
👤 Account Name - <b>Yan..kha</b><br>
* After transferring funds, please upload your KBZPay payment screenshot below.
</div>

<label>Upload KPay Payment Screenshot</label>
<input type="file" id="paymentScreenshot" accept="image/*" required>

<label>🎯 Special Promotion Programs (Temporarily Closed)</label>
<div class="promo-section">
<label class="promo-option">
<input type="radio" name="promoSelection" value="promo_4_courses" disabled>
✨ Choose Any 4 Courses (285,000 MMK Special Package)
</label>
<label class="promo-option">
<input type="radio" name="promoSelection" value="all_in_one_package" disabled>
🌟 All-in-One Special Package (450,000 MMK)
</label>
</div>

<div id="promoNoticeBox" class="promo-notice"></div>

<label>Select Courses</label>
<div class="courses-container" id="coursesContainer">
<label class="course-item">
<input type="checkbox" name="course" value="Course 1 - Plucking Basics" data-price="50000" checked onclick="return false;" onchange="calculateTotal()">
<b>Course 1 - Plucking Basics (50,000 MMK)</b>
</label>
<label class="course-item locked"><input type="checkbox" disabled> Course 2 - Plucking Intermediate <span class="soon-tag">Coming Soon</span></label>
<label class="course-item locked"><input type="checkbox" disabled> Course 3 - Rhythm Basics <span class="soon-tag">Coming Soon</span></label>
<label class="course-item locked"><input type="checkbox" disabled> Course 4 - Rhythm Intermediate <span class="soon-tag">Coming Soon</span></label>
<label class="course-item locked"><input type="checkbox" disabled> Course 5 - Advanced Rhythm <span class="soon-tag">Coming Soon</span></label>
<label class="course-item locked"><input type="checkbox" disabled> Course 6 - Fingerstyle Basics <span class="soon-tag">Coming Soon</span></label>
<label class="course-item locked"><input type="checkbox" disabled> Course 7 - Basic Music Theory <span class="soon-tag">Coming Soon</span></label>
<label class="course-item locked"><input type="checkbox" disabled> Course 8 - Intermediate Music Theory <span class="soon-tag">Coming Soon</span></label>
</div>
<button type="submit" id="submitBtn">Submit Payment Verification</button>
<div id="successMsg" class="success-msg"></div>
</form>

<div class="login-guide">
Already registered? Access lessons via Member Login below 👇
</div>

<a href="login.html" class="back-btn">Return to Member Login</a>
</div>

<script>
// Stable Supabase Client Initialization
const SUPABASE_URL_VAL = 'https://qyoyxagrkpzppacnpdbc.supabase.co'; 
const SUPABASE_ANON_KEY_VAL = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5b3l4YWdya3B6cHBhY25wZGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTg0MTIsImV4cCI6MjEwNDY5NDQxMn0.giB8iSYSZCUQijzUGW6pp1Uo-CB2DUIEt1faZnip9l0';

let dbClient = null;
try {
    if (window.supabase && window.supabase.createClient) {
        dbClient = window.supabase.createClient(SUPABASE_URL_VAL, SUPABASE_ANON_KEY_VAL);
    }
} catch (err) {
    console.error('Supabase Initialization Error:', err);
}

const TELEGRAM_BOT_TOKEN = "8745766599:AAHFC38Zza-YC56neTJj--9wByQieCd4QFk";
const TELEGRAM_CHAT_ID = "6868820956";

function normalizePhone(phone) {
    if (!phone) return "";
    let cleaned = phone.toString().replace(/\s+/g, '').replace(/[-+]/g, '');
    if (cleaned.startsWith('959')) {
        cleaned = '0' + cleaned.substring(2);
    }
    return cleaned;
}

function calculateTotal() {
    const totalPriceEl = document.getElementById('totalPrice');
    if(totalPriceEl) totalPriceEl.innerText = "50,000";
}

async function submitRegistration(e) {
    e.preventDefault();
    const nameEl = document.getElementById('studentName');
    const phoneEl = document.getElementById('studentPhone');
    const fileInput = document.getElementById('paymentScreenshot');
    const submitBtn = document.getElementById('submitBtn');
    
    const name = nameEl ? nameEl.value.trim() : '';
    const rawPhone = phoneEl ? phoneEl.value : '';
    const phone = normalizePhone(rawPhone);

    if (!fileInput || fileInput.files.length === 0) {
        alert('Please select and upload your payment screenshot.');
        return;
    }

    let selectedCourses = ["Course 1 - Plucking Basics"];
    let totalAmount = 50000;

    if(submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";
    }

    const file = fileInput.files[0];
    const fileName = file.name;
    const registrationDate = new Date().toLocaleString();

    let studentData = {
        name,
        phone,
        courses: selectedCourses,
        total: totalAmount,
        screenshotName: fileName,
        date: registrationDate
    };

    try {
        if (dbClient) {
            const { data, error } = await dbClient
                .from('registrations')
                .insert([
                    { 
                        name: name, 
                        phone: phone, 
                        courses: selectedCourses, 
                        total: totalAmount, 
                        screenshot_name: fileName,
                        status: 'pending' 
                    }
                ]);

            if (error) {
                console.error('Supabase Insert Error:', error);
            }
        } else {
            console.error('dbClient is not initialized!');
        }

        let pendingRequests = JSON.parse(localStorage.getItem('pendingRequests')) || [];
        if (!Array.isArray(pendingRequests)) pendingRequests = [];
        pendingRequests.push(studentData);
        localStorage.setItem('pendingRequests', JSON.stringify(pendingRequests));

        let pendingStudents = JSON.parse(localStorage.getItem('pendingStudents')) || [];
        if (!Array.isArray(pendingStudents)) pendingStudents = [];
        pendingStudents.push(studentData);
        localStorage.setItem('pendingStudents', JSON.stringify(pendingStudents));

    } catch (storageErr) {
        console.error('Storage/Database Error:', storageErr);
    }

    const caption = `🎯 New Course Registration\n\n👤 Name: ${name}\n📞 Phone: ${phone}\n📚 Selection: ${selectedCourses.join(', ')}\n💰 Total: ${totalAmount.toLocaleString()} MMK`;
    const formData = new FormData();
    formData.append('chat_id', TELEGRAM_CHAT_ID);
    formData.append('photo', file);
    formData.append('caption', caption);

    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        finalizeSuccess();
    })
    .catch(error => {
        console.log('Telegram Error:', error);
        finalizeSuccess();
    });
}

function finalizeSuccess() {
    const successMsg = document.getElementById('successMsg');
    if(successMsg) {
        successMsg.innerHTML = '✔ Registration Successful!<br>Your account will be activated within 24 hours after verification.';
        successMsg.style.display = 'block';
    }
    const regForm = document.getElementById('regForm');
    if(regForm) regForm.reset();
    
    const course1 = document.querySelector('input[name="course"]');
    if(course1) course1.checked = true;

    resetSubmitButton();
}

function resetSubmitButton() {
    const submitBtn = document.getElementById('submitBtn');
    if(submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Payment Verification";
    }
}

function goBack() {
    window.history.back();
}
</script>
</body>
</html>
