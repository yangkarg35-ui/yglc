<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGLC - Secure Guitar Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
}
body {
    background-color: #0b0b0b;
    color: #f7f4ef;
    font-family: 'Padauk', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    border-bottom: 1px solid #222;
    background: #141414;
}
.logo {
    font-size: 18px;
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 2px;
}
.user-info {
    display: flex;
    gap: 15px;
    align-items: center;
    font-size: 14px;
    color: #aaa;
}
.nav-btn {
    background: transparent;
    border: 1px solid #444;
    color: #ccc;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Padauk', sans-serif;
    text-decoration: none;
    transition: all 0.3s;
}
.nav-btn:hover {
    border-color: #d4af37;
    color: #d4af37;
}
.logout-btn {
    background: transparent;
    border: 1px solid #d4af37;
    color: #d4af37;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Padauk', sans-serif;
    transition: all 0.3s;
}
.logout-btn:hover {
    background: #d4af37;
    color: #0b0b0b;
}
.main-container {
    display: flex;
    flex: 1;
    overflow: hidden;
}
.video-section {
    flex: 3;
    padding: 20px 30px;
    overflow-y: auto;
    border-right: 1px solid #222;
    display: flex;
    flex-direction: column;
}
.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 78vh;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #222;
    margin-bottom: 15px;
}
.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}
.video-shield-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 55px;
    z-index: 10;
    background: transparent;
}
.video-shield-bottom {
    position: absolute;
    bottom: 0;
    right: 45px;
    width: 120px;
    height: 45px;
    z-index: 10;
    background: transparent;
}
.video-title {
    font-size: 18px;
    font-weight: 700;
    color: #f7f4ef;
    margin-bottom: 8px;
}
.video-desc {
    font-size: 13px;
    color: #999;
    line-height: 1.5;
}
.playlist-section {
    flex: 1;
    padding: 20px;
    background: #121212;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}
.course-tabs {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    margin-bottom: 15px;
    padding-bottom: 5px;
}
.course-tab {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #aaa;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'Padauk', sans-serif;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
}
.course-tab.active {
    background: #d4af37;
    color: #0b0b0b;
    border-color: #d4af37;
    font-weight: 700;
}
.course-tab.locked {
    opacity: 0.4;
    border-style: dashed;
}
.playlist-title {
    font-size: 16px;
    font-weight: 700;
    color: #d4af37;
    margin-bottom: 15px;
    border-bottom: 1px solid #222;
    padding-bottom: 8px;
}
.playlist-items {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.lesson-item {
    background: #1a1a1a;
    border: 1px solid #282828;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.3s;
}
.lesson-item:hover, .lesson-item.active {
    border-color: #d4af37;
    background: #1f1b10;
}
.lesson-item h4 {
    font-size: 13px;
    color: #fff;
    margin-bottom: 4px;
}
.lesson-item span {
    font-size: 11px;
    color: #777;
}
.locked-notice {
    text-align: center;
    padding: 40px 15px;
    color: #aaa;
}
.locked-notice h3 {
    color: #d4af37;
    font-size: 16px;
    margin-bottom: 10px;
}
.pay-btn {
    display: inline-block;
    margin-top: 15px;
    background: #d4af37;
    color: #0b0b0b;
    padding: 8px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
}
@media (max-width: 768px) {
    .main-container {
        flex-direction: column;
        overflow-y: auto;
    }
    body {
        height: auto;
        overflow: auto;
    }
    .video-section {
        border-right: none;
        border-bottom: 1px solid #222;
    }
}
</style>
</head>
<body>
<header>
    <div class="logo">YGLC GUITAR SCHOOL</div>
    <div class="user-info">
        <span>ကြိုဆိုပါတယ် Boss</span>

    <div class="video-section" id="videoSection">
        <div class="video-container">
            <div class="video-shield-top"></div>
            <div class="video-shield-bottom"></div>
            <iframe id="videoPlayer" src="" title="YGLC GUITAR LESSON" allowfullscreen></iframe>
        </div>
        <div id="videoTitle" class="video-title"></div>
        <div id="videoDesc" class="video-desc"></div>
    </div>
    <!-- သင်တန်းတက်ဘ်များနှင့် သင်ခန်းစာစာရင်း -->
    <div class="playlist-section">
        <div class="course-tabs" id="courseTabs"></div>
        <div class="playlist-title" id="currentCourseTitle">📚 သင်တန်း ၁</div>
        <div class="playlist-items" id="playlistItems">
            <!-- Dynamic ဖြင့် ဝင်လာမည် -->
        </div>
    </div>
</div>

let userPurchasedCourses = JSON.parse(localStorage.getItem("userPurchasedCourses")) || [1, 2, 3, 4, 5, 6, 7, 8];
let currentActiveCourse = userPurchasedCourses[0] || 1;
let activeVideoIndex = 0;

function initDashboard() {
    renderTabs();
    switchCourse(currentActiveCourse);
}

function renderTabs() {
    const tabsContainer = document.getElementById('courseTabs');
    tabsContainer.innerHTML = '';
    for (let i = 1; i <= 8; i++) {
        const isOwned = userPurchasedCourses.includes(i);
        const btn = document.createElement('button');
        btn.className = `course-tab ${i === currentActiveCourse ? 'active' : ''} ${!isOwned ? 'locked' : ''}`;
        btn.innerHTML = `သင်တန်း ${i} ${!isOwned ? '🔒 ' : ''}`;
        btn.onclick = () => switchCourse(i);
        tabsContainer.appendChild(btn);
    }
}

function switchCourse(courseNum) {
    currentActiveCourse = courseNum;
    activeVideoIndex = 0;
    renderTabs();
    
    const isOwned = userPurchasedCourses.includes(courseNum);
    const videoSection = document.getElementById('videoSection');
    const playlistItems = document.getElementById('playlistItems');
    const courseTitleElem = document.getElementById('currentCourseTitle');
    
    if (!isOwned) {
        courseTitleElem.innerText = `သင်တန်း ${courseNum} (လော့ခ်ကျနေပါသည်)`;
        videoSection.innerHTML = `
            <div class="locked-notice">
                <h3>ဤသင်တန်းကို လော့ခ်ဖွင့်ရန် လိုအပ်ပါသည်။</h3>
                <p>သင်တန်း ${courseNum} ၏ ဗီဒီယို ၁၅ ပုဒ်လုံးကို လေ့လာရန် ငွေပေးချေမှု ပြုလုပ်ပါ။</p>
                <a href="index.html" class="pay-btn">ငွေပေးချေရန်</a>
            </div>
        `;
        playlistItems.innerHTML = '<div style="text-align:center; color:#777; padding:20px; font-size:12px;">ရောက်ခွင့် မရှိသေးပါ။</div>';
        return;
    }
    
    videoSection.innerHTML = `
        <div class="video-container">
            <div class="video-shield-top"></div>
            <div class="video-shield-bottom"></div>
            <iframe id="videoPlayer" src="" title="YGLC GUITAR LESSON" allowfullscreen></iframe>
        </div>
        <div id="videoTitle" class="video-title"></div>
        <div id="videoDesc" class="video-desc"></div>
    `;
    
    courseTitleElem.innerText = coursesData[courseNum].name;
    loadPlaylist();
    changeLesson(
        coursesData[courseNum].lessons[0].id,
        coursesData[courseNum].lessons[0].title,
        coursesData[courseNum].lessons[0].desc,
        0
    );
}

function loadPlaylist() {
    const playlistContainer = document.getElementById('playlistItems');
    playlistContainer.innerHTML = '';
    const courseLessons = coursesData[currentActiveCourse].lessons;
    
    courseLessons.forEach((lesson, index) => {
        const item = document.createElement('div');
        item.className = `lesson-item ${index === activeVideoIndex ? 'active' : ''}`;
        item.onclick = () => {
            changeLesson(lesson.id, lesson.title, lesson.desc, index);
        };
        item.innerHTML = `
            <h4>${lesson.title}</h4>
            <span>YouTube Secure (${index + 1}/15)</span>
        `;
        playlistContainer.appendChild(item);
    });
}

function changeLesson(videoId, title, desc, index) {
    activeVideoIndex = index;
    const playerElement = document.getElementById('videoPlayer');
    const titleElement = document.getElementById('videoTitle');
    const descElement = document.getElementById('videoDesc');
    
    if (playerElement) {
        playerElement.src = "https://www.youtube.com/embed/" + videoId + "?controls=1&modestbranding=1&rel=0&disablekb=1&fs=1";
        titleElement.innerText = title;
        descElement.innerText = desc;
    }
    
    const items = document.querySelectorAll('.lesson-item');
    items.forEach((item, idx) => {
        if (idx === index) {
            item.classList.add('active');
        } else {
            item.classList.remove('active');
        }
    });
}

function logout() {
    localStorage.removeItem("isLoggedIn");
    window.location.href = "login.html";
}

window.onload = function() {
    initDashboard();
};

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert("YGLC GUITAR SCHOOL: Protected Content.");
});

document.addEventListener('keydown', function(e) {
    if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73) || (e.ctrlKey && e.keyCode === 85) || (e.ctrlKey && e.keyCode === 83)) {
        e.preventDefault();
        return false;
    }
});
</script>
