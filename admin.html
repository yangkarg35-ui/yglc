<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<title>YGLC Admin Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<!-- Supabase CDN ထည့်သွင်းခြင်း -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background: #0b0b0b; color: #f7f4ef; font-family: 'Padauk', sans-serif; padding: 40px; }
h2 { color: #d4af37; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; background: #141414; border: 1px solid #222; }
th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #222; font-size: 14px; vertical-align: middle; }
th { background: #1a1a1a; color: #d4af37; }
.confirm-btn { background: #d4af37; color: #0b0b0b; border: none; padding: 6px 14px; font-weight: 700; border-radius: 4px; cursor: pointer; font-family: 'Padauk', sans-serif; transition: background 0.2s; }
.confirm-btn:hover { background: #b3922e; }
.confirm-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
.empty { color: #777; text-align: center; padding: 20px; }
.course-list { margin: 0; padding-left: 18px; font-size: 13px; color: #e2e8f0; }
.screenshot-text { color: #a0aec0; font-size: 12px; display: inline-block; margin-top: 5px; }
</style>
</head>
<body>
<h2>Boss ၏ Admin အတည်ပြုရန် စာရင်းများ (Supabase Cloud)</h2>
<table>
<thead>
<tr>
<th>ကျောင်းသားနာမည်</th>
<th>ဖုန်းနံပါတ်</th>
<th>တောင်းဆိုထားသော သင်တန်းများ</th>
<th>ငွေလွှဲပုံအမည်</th>
<th>ရက်စွဲ</th>
<th>လုပ်ဆောင်ချက်</th>
</tr>
</thead>
<tbody id="pendingTableBody">
<tr><td colspan="6" class="empty">ဒေတာများကို ဆွဲထုတ်နေပါသည်...</td></tr>
</tbody>
</table>

<script>
// Supabase ချိတ်ဆက်ရန် အချက်အလက်များ
const SUPABASE_URL = 'https://qyoyxagrkpzppacnpdbc.supabase.co'; 
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5b3l4YWdya3B6cHBhY25wZGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTg0MTIsImV4cCI6MjEwNDY5NDQxMn0.giB8iSYSZCUQijzUGW6pp1Uo-CB2DUIEt1faZnip9l0';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ဖုန်းနံပါတ် စံသတ်မှတ်ချက် ညှိပေးသည့် Function
function normalizePhone(phone) {
    if (!phone) return "";
    let cleaned = phone.toString().replace(/\s+/g, '').replace(/[-+]/g, '');
    if (cleaned.startsWith('959')) {
        cleaned = '0' + cleaned.substring(2);
    }
    return cleaned;
}

// Supabase မှ pending စာရင်းများကို လှမ်းဆွဲထုတ်ခြင်း
async function loadPendingRequests() {
    const tbody = document.getElementById('pendingTableBody');
    if (!tbody) return;
    
    tbody.innerHTML = `<tr><td colspan="6" class="empty">ဒေတာများကို ဆွဲထုတ်နေပါသည်...</td></tr>`;

    try {
        const { data: registrations, error } = await supabase
            .from('registrations')
            .select('*')
            .eq('status', 'pending')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Supabase fetch error:', error);
            tbody.innerHTML = `<tr><td colspan="6" class="empty" style="color: #f87171;">ဒေတာရယူရာတွင် အမှားအယွင်း ရှိခဲ့ပါသည်။</td></tr>`;
            return;
        }

        if (!registrations || registrations.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty">စောင့်ဆိုင်းဆဲ စာရင်း မရှိသေးပါ။</td></tr>`;
            return;
        }

        tbody.innerHTML = '';

        registrations.forEach((req) => {
            const tr = document.createElement('tr');
            let coursesHtml = "";
            
            let coursesArr = req.courses;
            if (typeof coursesArr === 'string') {
                try { coursesArr = JSON.parse(coursesArr); } catch(e) { coursesArr = [req.courses]; }
            }

            if (Array.isArray(coursesArr)) {
                coursesHtml = `<ul class="course-list">` + coursesArr.map(c => `<li>${c}</li>`).join('') + `</ul>`;
            } else {
                coursesHtml = `<span style="color: #f87171;">သင်တန်း အချက်အလက် မပါရှိပါ</span>`;
            }

            let screenshotInfo = req.screenshot_name ? `<br><span class="screenshot-text">📁 ပုံအမည်: ${req.screenshot_name}</span>` : "";
            let formattedDate = req.created_at ? new Date(req.created_at).toLocaleString() : '-';

            tr.innerHTML = `
                <td><b>${req.name || ''}</b>${screenshotInfo}</td>
                <td>${req.phone || '-'}</td>
                <td>${coursesHtml}</td>
                <td>${req.screenshot_name || '-'}</td>
                <td>${formattedDate}</td>
                <td><button class="confirm-btn" id="btn-${req.id}" onclick="approveStudent('${req.id}', '${req.phone}', '${encodeURIComponent(JSON.stringify(coursesArr || []))}', '${encodeURIComponent(req.name || '')}')">Confirm 🟢</button></td>
            `;
            tbody.appendChild(tr);
        });

    } catch (err) {
        console.error('Error loading pending requests:', err);
        tbody.innerHTML = `<tr><td colspan="6" class="empty" style="color: #f87171;">ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။</td></tr>`;
    }
}

// ကျောင်းသားကို အတည်ပြုပေးခြင်း (Supabase Update + LocalStorage Sync)
async function approveStudent(id, rawPhone, encodedCourses, encodedName) {
    const btn = document.getElementById(`btn-${id}`);
    if (btn) {
        btn.disabled = true;
        btn.innerText = "အတည်ပြုနေသည်...";
    }

    try {
        let cleanPhone = normalizePhone(rawPhone);
        let coursesArr = JSON.parse(decodeURIComponent(encodedCourses));
        let studentName = decodeURIComponent(encodedName);

        let courseNumbers = [];
        const myanmarNumbers = {'၀': '0', '၁': '1', '၂': '2', '၃': '3', '၄': '4', '၅': '5', '၆': '6', '၇': '7', '၈': '8', '၉': '9'};

        coursesArr.forEach(c => {
            let courseNameStr = String(c);
            let convertedStr = courseNameStr.replace(/[၀-၉]/g, match => myanmarNumbers[match]);

            if (convertedStr.includes("သင်တန်း") || convertedStr.includes("Course")) {
                let matches = convertedStr.match(/\d+/g);
                if (matches) {
                    matches.forEach(m => {
                        let num = parseInt(m, 10);
                        if (num >= 1 && num <= 8 && !courseNumbers.includes(num)) {
                            courseNumbers.push(num);
                        }
                    });
                }
            }
        });

        if (courseNumbers.length === 0) {
            courseNumbers = [1];
        }

        // ၁. Supabase ထဲတွင် status ကို approved သို့ ပြောင်းလဲခြင်း
        const { error: updateError } = await supabase
            .from('registrations')
            .update({ status: 'approved' })
            .eq('id', id);

        if (updateError) {
            console.error('Supabase update error:', updateError);
            alert('Database အပ်ဒိတ်လုပ်ရာတွင် အမှားအယွင်း ရှိသွားပါသည်။');
            if(btn) { btn.disabled = false; btn.innerText = "Confirm 🟢"; }
            return;
        }

        // ၂. Login ဝင်နိုင်ရန် LocalStorage တွင်ပါ Sync လုပ်သိမ်းပေးခြင်း
        let approvedUsers = JSON.parse(localStorage.getItem('approvedUsers')) || {};
        approvedUsers[cleanPhone] = courseNumbers;
        localStorage.setItem('approvedUsers', JSON.stringify(approvedUsers));

        let studentObj = {
            name: studentName,
            phone: cleanPhone,
            courses: coursesArr,
            approvedCourses: courseNumbers
        };

        const approvalKeys = ['approvedStudents', 'registeredStudents', 'users'];
        approvalKeys.forEach(key => {
            let list = JSON.parse(localStorage.getItem(key)) || [];
            if (!Array.isArray(list)) list = [];
            let exists = list.some(u => normalizePhone(u.phone || u.phoneNumber) === cleanPhone);
            if (!exists) {
                list.push(studentObj);
            } else {
                list = list.map(u => normalizePhone(u.phone || u.phoneNumber) === cleanPhone ? studentObj : u);
            }
            localStorage.setItem(key, JSON.stringify(list));
        });

        alert(studentName + " (" + cleanPhone + ") ကို အောင်မြင်စွာ အတည်ပြုပြီးပါပြီ။");
        loadPendingRequests();

    } catch (err) {
        console.error('Approval execution error:', err);
        alert('အတည်ပြုရာတွင် အမှားအယွင်း ရှိသွားပါသည်။');
        if(btn) { btn.disabled = false; btn.innerText = "Confirm 🟢"; }
    }
}

window.onload = loadPendingRequests;
</script>
</body>
</html>
