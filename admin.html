<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<title>YGLC Admin Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<!-- Supabase CDN ထည့်သွင်းခြင်း -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background: #0b0b0b; color: #f7f4ef; font-family: 'Padauk', sans-serif; padding: 40px; }
h2 { color: #d4af37; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; background: #141414; border: 1px solid #222; }
th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #222; font-size: 14px; vertical-align: middle; }
th { background: #1a1a1a; color: #d4af37; }
.confirm-btn { background: #d4af37; color: #0b0b0b; border: none; padding: 6px 14px; font-weight: 700; border-radius: 4px; cursor: pointer; font-family: 'Padauk', sans-serif; }
.confirm-btn:hover { background: #b3922e; }
.empty { color: #777; text-align: center; padding: 20px; }
.course-list { margin: 0; padding-left: 18px; font-size: 13px; color: #e2e8f0; }
.screenshot-link { color: #38bdf8; text-decoration: none; font-size: 12px; display: inline-block; margin-top: 5px; }
</style>
</head>
<body>
<h2>Boss ၏ Admin အတည်ပြုရန် စာရင်းများ (Supabase Cloud)</h2>
<table>
<thead>
<tr>
<th>ကျောင်းသားနာမည်</th>
<th>ဖုန်းနံပါတ်</th>
<th>တောင်းဆိုထားသော သင်တန်းများ</th>
<th>ရက်စွဲ</th>
<th>လုပ်ဆောင်ချက်</th>
</tr>
</thead>
<tbody id="pendingTableBody">
    <tr><td colspan="5" class="empty">ဒေတာများကို ရယူနေပါသည်...</td></tr>
</tbody>
</table>

<script>
// Supabase ချိတ်ဆက်ရန် အချက်အလက်များ
const SUPABASE_URL = 'https://qyoyxagrkpzppacnpdbc.supabase.co'; 
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5b3l4YWdya3B6cHBhY25wZGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTg0MTIsImV4cCI6MjEwNDY5NDQxMn0.giB8iSYSZCUQijzUGW6pp1Uo-CB2DUIEt1faZnip9l0';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ဖုန်းနံပါတ် စံသတ်မှတ်ချက် ညှိပေးသည့် Function
function normalizePhone(phone) {
    if (!phone) return "";
    let cleaned = phone.toString().replace(/\s+/g, '').replace(/[-+]/g, '');
    if (cleaned.startsWith('959')) {
        cleaned = '0' + cleaned.substring(2);
    }
    return cleaned;
}

// Supabase မှ Pending စာရင်းများကို လှမ်းဆွဲထုတ်ခြင်း
async function loadPendingRequests() {
    const tbody = document.getElementById('pendingTableBody');
    if (!tbody) return;
    
    try {
        const { data: registrations, error } = await supabase
            .from('registrations')
            .select('*')
            .eq('status', 'pending')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Supabase Error:', error);
            tbody.innerHTML = `<tr><td colspan="5" class="empty" style="color: #f87171;">ဒေတာ ရယူရာတွင် အမှားအယွင်း ရှိပါသည်။</td></tr>`;
            return;
        }

        if (!registrations || registrations.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty">စောင့်ဆိုင်းဆဲ စာရင်း မရှိသေးပါ။</td></tr>`;
            return;
        }

        tbody.innerHTML = '';
        registrations.forEach((req) => {
            const tr = document.createElement('tr');
            let coursesHtml = "";
            
            if (Array.isArray(req.courses)) {
                coursesHtml = `<ul class="course-list">` + req.courses.map(c => `<li>${c}</li>`).join('') + `</ul>`;
            } else if (req.courses) {
                coursesHtml = `<ul class="course-list"><li>${req.courses}</li></ul>`;
            } else {
                coursesHtml = `<span style="color: #f87171;">သင်တန်း အချက်အလက် မပါရှိပါ</span>`;
            }

            let screenshotHtml = req.screenshot_name ? `<br><span style="font-size: 12px; color: #aaa;">ဖိုင်: ${req.screenshot_name}</span>` : "";

            tr.innerHTML = `
                <td><b>${req.name || ''}</b>${screenshotHtml}</td>
                <td>${req.phone || '-'}</td>
                <td>${coursesHtml}</td>
                <td>${req.created_at ? new Date(req.created_at).toLocaleDateString() : '-'}</td>
                <td><button class="confirm-btn" onclick="approveStudent('${req.id}', '${req.name}', '${req.phone}')">Confirm 🟢</button></td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="5" class="empty" style="color: #f87171;">ချိတ်ဆက်မှု အမှားအယွင်း ရှိပါသည်။</td></tr>`;
    }
}

// Admin မှ Confirm ပေးလိုက်သောအခါ Supabase တွင် status ကို 'approved' သို့ ပြောင်းခြင်း
async function approveStudent(id, name, phone) {
    if (!confirm(`${name} (${phone}) ကို အတည်ပြုရန် သေချာပါသလား?`)) return;

    try {
        const { error } = await supabase
            .from('registrations')
            .update({ status: 'approved' })
            .eq('id', id);

        if (error) {
            console.error('Error approving student:', error);
            alert('အတည်ပြုရာတွင် အမှားအယွင်း ရှိသွားပါသည်။');
            return;
        }

        alert(name + " (" + phone + ") ကို အောင်မြင်စွာ အတည်ပြုပြီးပါပြီ။ ယခု မည်သည့်ဖုန်းမှမဆို Login ဝင်လို့ရပါပြီ။");
        loadPendingRequests();
    } catch (err) {
        console.error(err);
        alert('အတည်ပြုရာတွင် အမှားအယွင်း ရှိသွားပါသည်။');
    }
}

window.onload = loadPendingRequests;
</script>
</body>
</html>
